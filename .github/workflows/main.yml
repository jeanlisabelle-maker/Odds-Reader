name: Build Odds Reader APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Odds-Reader-REPO-READY 4
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - run: chmod +x ./gradlew
      - run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: OddsReader-APK
          path: Odds-Reader-REPO-READY 4/app/build/outputs/apk/debug/app-debug.apk

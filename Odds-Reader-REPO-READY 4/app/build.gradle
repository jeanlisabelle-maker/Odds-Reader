
plugins { id 'com.android.application' }
android {
    namespace 'com.oddsreader.app'
    compileSdk 34
    defaultConfig {
        applicationId "com.oddsreader.app"
        minSdk 26
        targetSdk 34
        versionCode 13
        versionName "13.0"
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
